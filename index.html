document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px\">AI<\/span>\n      <\/div>\n      <h3 style=\"font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em\" data-i18n=\"f7t\">ИИ-ассистент в LXMF<\/h3>\n      <p style=\"font-size:14px;line-height:1.55;color:var(--ink3);margin:0 0 14px\" data-i18n=\"f7b\">Спрашивай что угодно прямо в чате шлюза — встроенный ИИ отвечает текстом, знает курс валют и погоду, расширяется собственными командами.<\/p>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink4);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">← что такое Reticulum RNS?<br>→ криптографический протокол для…<\/div>\n    <\/div>\n    <div style=\"background:var(--surf);border:1px solid var(--l6);border-radius:20px;padding:22px;box-shadow:0 4px 16px rgba(var(--shc),.05);transition:transform .25s,box-shadow .25s\" style-hover=\"transform:translateY(-4px);box-shadow:0 16px 34px rgba(var(--shc),.11)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#5ccbfa\">08<\/span>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:#a9dcf0;border:1px solid rgba(169,220,240,.35);border-radius:999px;padding:3px 9px\">LIVE EDIT<\/span>\n      <\/div>\n      <h3 style=\"font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em\" data-i18n=\"f8t\">Редактор конфигов<\/h3>\n      <p style=\"font-size:14px;line-height:1.55;color:var(--ink3);margin:0 0 14px\" data-i18n=\"f8b\">Управляй интерфейсами RNS, мостом LXMF и Nomadnet прямо из браузера: включай, отключай, добавляй TCP- и LoRa-интерфейсы, применяй изменения одной кнопкой. Перед каждой записью делается резервная копия.<\/p>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink4)\">enable_transport · TCPClientInterface · + ADD<\/div>\n    <\/div>\n    <div n=\"b5\">Нашёл баг, есть идея или просто хочешь обсудить mesh-сети — пиши.<\/p>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <a href=\"mailto:e2ret@tuta.io\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#a9dcf0;background:rgba(169,220,240,.1);border:1px solid rgba(169,220,240,.25);border-radius:999px;padding:11px 20px\">e2ret@tuta.io<\/a>\n          <a href=\"https://t.me/reticulum_belgorod/70\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#a9dcf0;background:rgba(169,220,240,.1);border:1px solid rgba(169,220,240,.25);border-radius:999px;padding:11px 20px\">Telegram<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer style=\"padding:40px 4px 56px\">\n  <div style=\"font-size:13px;color:var(--ink3);margin-bottom:12px\">\n    <span data-i18n=\"foot1\">NOEMA RNSGate Full — построено на <\/span><a href=\"https://reticulum.network\" target=\"_blank\" rel=\"noopener\">Reticulum Network Stack<\/a><span data-i18n=\"foot2\"> (Mark Qvist, MIT) · распространяется как есть, без гарантий<\/span>\n  <\/div>\n  <div style=\"font-size:11px;line-height:1.65;color:var(--ink5);max-width:860px\" data-i18n=\"disc\">Только для личного использования и исследований. Пользователь несёт ответственность за соблюдение местного законодательства о радиочастотах. Не предназначено для использования в юрисдикциях, где шифрованная mesh-радиосвязь требует специальной лицензии. Программное обеспечение не включает радиооборудование и само по себе ничего не передаёт.<\/div>\n<\/footer>\n\n<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst EN = {\n  f10t:\"Globe of links\", f10b:\"The home page has a globe with an arc to every TCP hub of the gateway. The GeoIP database works offline: no address ever leaves the gateway. Metrics, services and their addresses sit next to it.\",\n  f11t:\"Interface diagnostics\", f11b:\"A button next to the IP explains in plain words what is wrong: a hub does not respond, a connection keeps dropping, the dashboard was restarted too often. View only, it switches nothing off.\",\n  f12t:\"Profiles and discovered interfaces\", f12b:\"The Home and Hike profiles switch the right set of interfaces on with one tap. The discovered-interfaces card lists the hubs and radios other nodes announce: with distance, search and an Add button.\",\n  pg1:\"Home: globe of links, metrics, services and addresses\",\n  pg2:\"Node radar, filters by hops and source, 📡 signal, path check\",\n  pg3:\"Real-time service logs and a root terminal\",\n  pg4:\"LoRa radio status and charts\",\n  pg5:\"Anonymous tunnel\",\n  pg6:\"RTL-SDR spectrum and LoRa packet detection\",\n  pg7:\"Built-in LXMF messenger\",\n  pg8:\"Page editor and node browser\",\n  pg9:\"RNS interfaces, profiles, discovered interfaces, config editors\",\n  pg10:\"Backup, updates, Telegram, access\",\n\n  nav1:\"Features\", nav2:\"How it works\", nav3:\"Dashboard\", nav4:\"Inside\", nav5:\"Install\", navcta:\"Install\",\n  eyebrow:\"RETICULUM MESH GATEWAY · LIVE\",\n  h1a:\"Carry meaning,\", h1b:\"not just data.\", h1c:\"Off the grid.\",\n  sub:\"NOEMA RNSGate is a mesh gateway that carries encrypted messages over LoRa, I2P and TCP. No cloud. No servers. No middlemen.\",\n  cta1:\"Install\", cta2:\"See the dashboard\", cta3:\"Open on GitHub →\",\n  lbl1:\"FEATURES\", t1:\"Everything in one package\",\n  b1:\"Built on the Reticulum Network Stack — a network with cryptography baked in from the ground up, made for slow and unreliable links.\",\n  f1t:\"LoRa & RNode\", f1b:\"Connect an RNode over USB or Wi-Fi. Live RSSI, SNR and noise-floor graphs plus an interference detector — long-range encrypted radio, no infrastructure, no licence.\",\n  f2t:\"Home Assistant bridge\", f2b:\"Send commands to HA over the LoRa radio link. Trigger automations from anywhere — fully off-grid.\",\n  f3t:\"Anonymous I2P network\", f3b:\"Link two gateways anonymously, with no public IP. Tunnel setup is one click from the dashboard.\",\n  f4t:\"Nomadnet & rBrowser\", f4b:\"Host pages on the Reticulum network, edit them in the built-in Micron composer, and browse other nodes with the built-in rBrowser. Python scripts with a cron scheduler.\",\n  f5t:\"Mesh network map\", f5b:\"A radar of Reticulum nodes — RNS, LXMF, Nomadnet, PropNode. Filters by hops and by source (📡 radio / 🌐 TCP), RSSI and SNR of nodes heard over LoRa, path check and probe on a button.\",\n  f6t:\"Built-in chat\", f6b:\"A full LXMF messenger right in the dashboard — contacts, attachments, delivery receipts. Compatible with Sideband and MeshChat.\",\n  f7t:\"AI assistant over LXMF\", f7b:\"Ask anything straight in the gateway's chat — the built-in AI replies in plain text, knows currency rates and weather, and is extensible with your own commands.\",\n  f8t:\"Config editor\", f8b:\"Manage RNS interfaces, the LXMF bridge and Nomadnet straight from the browser: enable, disable, add TCP and LoRa interfaces, apply changes with one click. A backup is made before every write.\",\n  f9t:\"Full root access\", f9b:\"Live logs for every service, a built-in root terminal in the browser, one-click backup and restore, scheduled maintenance and identity reset.\",\n  how:\"HOW IT WORKS\", t6:\"The path of one message\",\n  hin:\"INBOUND LINKS\", hout:\"OUTBOUND LINKS\", d7:\"Web dashboard\", d7s:\"browser · port 8081\",\n  d1:\"Phone\", d1s:\"Sideband / MeshChat\", d2s:\"LoRa radio 869 MHz\", d3s:\"gateway · dashboard :8081\",\n  d4s:\"automations\", d5:\"Another gateway\", d5s:\"a mesh node somewhere else\", d6s:\"pages and files in the mesh\",\n  lbl2:\"DASHBOARD\", t2:\"Full control from the browser\",\n  b2:\"Watch services, edit configs, read logs, follow a globe of your links and a live map of the mesh — all on port 8081, with a root terminal in the browser. No SSH.\",\n  lbl3:\"THE PACKAGE\", t3:\"What's inside\",\n  b3:\"Full source on GitHub — clone it and run it on any Debian/Ubuntu device.\",\n  i1:\"One-command install. Pulls dependencies, sets up systemd services, asks for your MQTT details.\",\n  i2n:\"Web dashboard\", i2:\"A Flask interface on port 8081. Services, Nodes, Logs, RNode, I2P, SDR, Chat, Nomadnet, Configs and System pages; a dark theme in one blue tone that works on a phone too.\",\n  i3:\"An LXMF ↔ MQTT bridge with built-in commands and full Home Assistant integration.\",\n  i4n:\"systemd services\", i4:\"dashboard (Reticulum runs inside it), noema_lxmf_bridge, i2pd, nomadnet, rbrowser — shipped as ready systemd units.\",\n  i5n:\"Documentation\", i5:\"README that auto-translates to the user's system language — install, configuration, use cases, troubleshooting.\",\n  i6:\"One-click backup of every config, page, script and identity key. Restore from the dashboard.\",\n  req:\"REQUIREMENTS: \", reqb:\"Debian / Ubuntu · Python 3.10+ · root · x86_64 or ARM (Orange Pi, Raspberry Pi, mini-PC…)\",\n  lbl4:\"INSTALL\", t4:\"Installs with one command\",\n  b4:\"Any Debian/Ubuntu device — x86_64 or ARM. Updates are one button in the dashboard.\",\n  g1:\"install.sh setup script\", g2:\"Web dashboard (every panel)\", g3:\"LXMF Bridge bot\",\n  g4:\"Auto-translated docs\", g5:\"One-button updates\", g6:\"No cloud, no telemetry\",\n  b5:\"Found a bug, have an idea, or just want to talk mesh networking — get in touch.\",\n  poster:\"No cloud. No servers. No middlemen.\",\n  posters:\"END-TO-END ENCRYPTED · SELF-HOSTED · OFF-GRID\",\n  foot1:\"NOEMA RNSGate Full — built on \", foot2:\" (Mark Qvist, MIT) · distributed as is, without warranty\",\n  disc:\"For personal use and research only. The user is responsible for complying with local radio-frequency regulations. Not intended for use in jurisdictions where encrypted mesh radio requires a special licence. The software includes no radio hardware and transmits nothing on its own.\"\n};\n\nconst LOGS = [\n  [\"[RNS]\", \"Transport instance started\", \"#e1eff8\"],\n  [\"[RNS]\", \"Announce sent → 3 interfaces\", \"#9db6c6\"],\n  [\"[LoRa]\", \"RSSI −87 dBm · SNR 9.5 · 869.5 MHz\", \"#9db6c6\"],\n  [\"[LXMF]\", \"Message from <3a7f…b2c1>: \\\"lights on\\\"\", \"#e1eff8\"],\n  [\"[MQTT]\", \"→ topic: message/lxmf/receive\", \"#9db6c6\"],\n  [\"[HA]\", \"Automation triggered: lights.living on\", \"#e1eff8\"],\n  [\"[LXMF]\", \"Reply sent → \\\"Done!\\\"\", \"#a9dcf0\"],\n  [\"[I2P]\", \"Tunnel established · 4 hops\", \"#9db6c6\"],\n  [\"[RNS]\", \"Path resolved in 1.42s · 2 hops\", \"#9db6c6\"],\n  [\"[NN]\", \"Nomadnet page served: /page/index.mu\", \"#e1eff8\"]\n];\n\nclass Component extends DCLogic {\n  state = { lang: \"ru\", copied: false, tick: 0, cpu: 7, ram: 43, sent: 2, recv: 2 };\n\n  componentDidMount() {\n    this.ru = new Map();\n    document.querySelectorAll(\"[data-i18n]\").forEach(el => this.ru.set(el, el.textContent));\n    this.logTimer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 1500);\n    this.statTimer = setInterval(() => this.setState(s => ({\n      cpu: Math.max(2, Math.min(38, s.cpu + Math.round((Math.random() - .45) * 9))),\n      ram: Math.max(38, Math.min(62, s.ram + Math.round((Math.random() - .5) * 3))),\n      sent: s.sent + (Math.random() < .35 ? 1 : 0),\n      recv: s.recv + (Math.random() < .3 ? 1 : 0)\n    })), 2200);\n    this.startBg();\n    this.setupReveal();\n  }\n  componentWillUnmount() {\n    clearInterval(this.logTimer); clearInterval(this.statTimer);\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener(\"resize\", this.onResize);\n  }\n  componentDidUpdate() { this.applyLang(); }\n\n  applyLang() {\n    if (!this.ru) return;\n    document.querySelectorAll(\"[data-i18n]\").forEach(el => {\n      if (!this.ru.has(el)) this.ru.set(el, el.textContent);\n      const k = el.getAttribute(\"data-i18n\");\n      const next = this.state.lang === \"en\" ? (EN[k] ?? this.ru.get(el)) : this.ru.get(el);\n      if (el.textContent !== next) el.textContent = next;\n    });\n  }\n\n  setupReveal() {\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    if (!(\"IntersectionObserver\" in window)) return;\n    const targets = [...document.querySelectorAll(\"section\")].slice(1);\n    targets.forEach(el => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(26px)\";\n      el.style.transition = \"opacity .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.4,0,.2,1)\";\n    });\n    const io = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.opacity = \"1\"; e.target.style.transform = \"none\"; io.unobserve(e.target);\n    }), { threshold: 0.05, rootMargin: \"0px 0px -60px 0px\" });\n    targets.forEach(el => io.observe(el));\n  }\n\n  startBg() {\n    const cv = this.bg;\n    if (!cv || window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    const ctx = cv.getContext(\"2d\");\n    let w = 0, h = 0, pts = [];\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const resize = () => {\n      w = cv.offsetWidth; h = cv.offsetHeight;\n      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const n = Math.min(64, Math.round(w * h / 26000));\n      pts = Array.from({ length: n }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .16\n      }));\n    };\n    this.onResize = resize;\n    resize();\n    window.addEventListener(\"resize\", resize);\n    const draw = () => {\n      ctx.clearRect(0, 0, w, h);\n      for (const p of pts) {\n        p.x += p.vx; p.y += p.vy;\n        if (p.x < 0 || p.x > w) p.vx *= -1;\n        if (p.y < 0 || p.y > h) p.vy *= -1;\n      }\n      for (let a = 0; a < pts.length; a++) {\n        for (let b = a + 1; b < pts.length; b++) {\n          const dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y;\n          const d = Math.hypot(dx, dy);\n          if (d < 150) {\n            ctx.strokeStyle = `rgba(92,203,250,${(1 - d / 150) * 0.16})`;\n            ctx.lineWidth = 1;\n            ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();\n          }\n        }\n        ctx.fillStyle = \"rgba(92,203,250,.3)\";\n        ctx.beginPath(); ctx.arc(pts[a].x, pts[a].y, 1.6, 0, Math.PI * 2); ctx.fill();\n      }\n      this.raf = requestAnimationFrame(draw);\n    };\n    draw();\n  }\n\n  copyCmd() {\n    const text = \"git clone https://github.com/e2ret/NOEMA-RNSGate-Full.git\\ncd NOEMA-RNSGate-Full && sudo bash install.sh\";\n    const done = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); };\n    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(done);\n    else {\n      const ta = document.createElement(\"textarea\");\n      ta.value = text; ta.style.position = \"fixed\"; ta.style.opacity = \"0\";\n      document.body.appendChild(ta); ta.select();\n      try { document.execCommand(\"copy\"); } catch (e) {}\n      document.body.removeChild(ta); done();\n    }\n  }\n\n  bars(pct, color) {\n    const total = 14, on = Math.round(total * pct / 100);\n    return React.createElement(React.Fragment, null, Array.from({ length: total }, (_, i) =>\n      React.createElement(\"span\", { key: i, style: {\n        flex: 1, height: 7, borderRadius: 1.5,\n        background: i < on ? color : \"var(--l9)\"\n      }})));\n  }\n\n  renderVals() {\n    const en = this.state.lang === \"en\";\n    const start = this.state.tick % LOGS.length;\n    const logs = Array.from({ length: 6 }, (_, k) => {\n      const l = LOGS[(start + k) % LOGS.length];\n      return { tag: l[0], text: l[1], color: l[2] };\n    });\n    const langBtn = a => ({\n      fontFamily: \"'JetBrains Mono',monospace\", fontSize: 11, fontWeight: 700, padding: \"6px 11px\",\n      borderRadius: 999, border: 0, cursor: \"pointer\",\n      background: a ? \"#5ccbfa\" : \"transparent\", color: a ? \"#04121c\" : \"var(--ink3)\"\n    });\n    return {\n      bgRef: el => { this.bg = el; },\n      gauges: [\n        { label: \"CPU\", value: this.state.cpu + \"%\", color: \"var(--ink)\", bars: this.bars(this.state.cpu, \"#3a9fd8\") },\n        { label: \"RAM\", value: this.state.ram + \"%\", color: \"var(--ink)\", bars: this.bars(this.state.ram, \"#3a9fd8\") },\n        { label: \"LXMF SENT\", value: String(this.state.sent), color: \"#3a9fd8\", bars: this.bars(Math.min(100, this.state.sent * 7), \"#5ccbfa\") },\n        { label: \"LXMF RECV\", value: String(this.state.recv), color: \"#4aa3de\", bars: this.bars(Math.min(100, this.state.recv * 7), \"#4aa3de\") }\n      ],\n      logs,\n      copy: () => this.copyCmd(),\n      copyLabel: this.state.copied ? (en ? \"COPIED ✓\" : \"СКОПИРОВАНО ✓\") : (en ? \"COPY\" : \"КОПИРОВАТЬ\"),\n      setRu: () => this.setState({ lang: \"ru\" }),\n      setEn: () => this.setState({ lang: \"en\" }),\n      ruBtnStyle: langBtn(!en),\n      enBtnStyle: langBtn(en)\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
